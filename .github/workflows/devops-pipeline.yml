name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Setup & Cache Dependencies
  prepare-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node Modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-cache-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      - name: Install Dependencies
        run: npm install

  # Jobs yang berjalan secara PARALEL
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Unit Tests (Parallel Job 1)
        run: npm test

  lint-html:
    needs: prepare-cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-cache-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      - name: Install Dependencies (from cache)
        run: npm install

      - name: Run HTML Validation (Parallel Job 2)
        run: npm run lint:html

  lint-css:
    needs: prepare-cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-cache-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      - name: Install Dependencies (from cache)
        run: npm install

      - name: Run CSS Style Check (Parallel Job 3)
        run: npm run lint:css

  # Verifikasi Docker Image & Compose
  docker-build:
    needs: [unit-test, lint-html, lint-css]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Build Versioned Docker Image
        run: docker build -t devops-v:1.0.0 .

  # Deploy Stage
  deploy-preview:
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulation Deploy
        run: |
          echo "Simulasi Deploy devops-v:1.0.0 ke Production / Preview Server Berhasil!"
          echo "Deployment timestamp: $(date)"
